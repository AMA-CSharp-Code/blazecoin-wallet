<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Blazecoin Wallet V2.0</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/wallet.css" />
    <link rel="stylesheet" href="BlazecoinWallet.Maui.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* Startup splash overlay — covers the initial Blazor render + the RAM
           image-preload burst (which janks the first few seconds). Faded out by
           dismissAppSplash() in mining-background.js once caching settles. */
        #app-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.6rem;
            background: #0a0a0a;
            transition: opacity 0.6s ease;
        }
        #app-splash.hide { opacity: 0; pointer-events: none; }
        #app-splash .splash-logo {
            width: min(46vw, 320px);
            height: auto;
            filter: drop-shadow(0 0 26px rgba(207, 32, 19, 0.45));
            animation: splashPulse 2s ease-in-out infinite;
        }
        #app-splash .splash-bar {
            width: min(60vw, 280px);
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }
        #app-splash .splash-bar-fill {
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #8b0000, #ff4d3a, #ffd966);
            animation: splashSlide 1.2s ease-in-out infinite;
        }
        #app-splash .splash-text {
            color: rgba(255, 255, 255, 0.7);
            font-family: 'Segoe UI', system-ui, sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
        }
        @keyframes splashPulse { 0%, 100% { transform: scale(1);    opacity: 0.9; } 50% { transform: scale(1.04); opacity: 1; } }
        @keyframes splashSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>
</head>

<body>

    <div id="app-splash">
        <img class="splash-logo" src="splash-shield.png" alt="Blazecoin" />
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
        <div class="splash-text">Loading wallet…</div>
    </div>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js"></script>
    <script src="js/mining-background.js"></script>
    <script src="js/jsqr.js"></script>
    <script src="js/qr-scan.js"></script>

</body>

</html>
